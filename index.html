<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carimbos SalesForce</title>
<style>
:root{--p:#6E00A7;--bg:#f6f1fa;--card:#fff;--tx:#241230;--mut:#6b5a78;--bd:#e0d2ea;--out:#fbf8fd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17101d;--card:#241830;--tx:#f4ecfa;--mut:#b9a7c8;--bd:#3d2b4d;--out:#1c1226}}
:root[data-theme="dark"]{--bg:#17101d;--card:#241830;--tx:#f4ecfa;--mut:#b9a7c8;--bd:#3d2b4d;--out:#1c1226}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{background:var(--p);color:#fff;padding:20px 16px;text-align:center;font-size:1.3rem;font-weight:700}
main{max-width:640px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:1rem;color:var(--p)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card h2{color:#d9a8f5}}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{flex:1;min-width:110px}
.opt input{position:absolute;opacity:0}
.opt span{display:block;text-align:center;padding:12px;border:2px solid var(--bd);border-radius:10px;cursor:pointer;font-weight:600;background:var(--card)}
.opt input:checked+span{background:var(--p);border-color:var(--p);color:#fff}
.opt input:focus-visible+span{outline:3px solid #b56ee0}
textarea{width:100%;min-height:120px;resize:vertical;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--out);color:var(--tx);font:inherit;line-height:1.5}
button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--p);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.12)}
.hint{color:var(--mut);font-size:.9rem;margin:0}
</style>
</head>
<body>
<header>Carimbos SalesForce</header>
<main>
  <div class="card">
    <h2>Contato com sucesso?</h2>
    <div class="opts">
      <label class="opt"><input type="radio" name="contato" value="sim"><span>Sim</span></label>
      <label class="opt"><input type="radio" name="contato" value="nao"><span>Não</span></label>
    </div>
  </div>
  <div class="card">
    <h2>Tipo de BD</h2>
    <div class="opts">
      <label class="opt"><input type="radio" name="tipo" value="Banda larga"><span>Banda larga</span></label>
      <label class="opt"><input type="radio" name="tipo" value="Linha"><span>Linha</span></label>
      <label class="opt"><input type="radio" name="tipo" value="TV"><span>TV</span></label>
    </div>
  </div>
  <div class="card">
    <h2>Mensagem</h2>
    <textarea id="saida" readonly placeholder="Selecione as opções acima para gerar o carimbo."></textarea>
    <button id="copiar" type="button">Copiar carimbo</button>
    <p class="hint" id="aviso"></p>
  </div>
</main>
<script>
const saida=document.getElementById('saida'),aviso=document.getElementById('aviso');
function val(n){const e=document.querySelector('input[name="'+n+'"]:checked');return e?e.value:null}
function gerar(){
  const c=val('contato'),t=val('tipo');
  if(!c||!t){saida.value='';return}
  saida.value=c==='sim'
    ?'Feito monitoramento de BD '+t+'. Contato com sucesso, validado com cliente '+t+' OK.'
    :'Feito acompanhamento do BD de '+t+'. Feito 3 tentativas de contato sem sucesso com o cliente para validação do funcionamento dos serviços.';
}
document.querySelectorAll('input[type=radio]').forEach(r=>r.addEventListener('change',gerar));
document.getElementById('copiar').addEventListener('click',async()=>{
  if(!saida.value){aviso.textContent='Selecione as duas opções primeiro.';return}
  try{await navigator.clipboard.writeText(saida.value);aviso.textContent='Copiado!'}
  catch(e){saida.select();document.execCommand('copy');aviso.textContent='Copiado!'}
  setTimeout(()=>aviso.textContent='',2000);
});
</script>
</body>
</html>
